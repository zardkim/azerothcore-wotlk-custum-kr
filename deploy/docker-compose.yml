# AzerothCore Playerbot (65개 모듈 + 한글화 SQL/DBC 이미 적용된 상태) — 배포 전용 docker-compose.yml
#
# 총 5개 상시 컨테이너를 사용합니다: ac-database, ac-worldserver, ac-authserver,
# ac-playerbots-data-init(1회성), ac-web(웹 포털)
# + ac-dirs-init(1회성) — BASE_DATA_DIR 하위 폴더가 없으면 docker compose up만으로 자동 생성
# + ac-kr-data-init(1회성) — 한글 DBC/data를 최초 설치 시에만 자동으로 받아서 채움
#
# 모든 실제 데이터(설정/맵/DB/로그)는 .env의 BASE_DATA_DIR 아래에 눈에 보이는 폴더로 저장됩니다.
#
#   ${BASE_DATA_DIR}/configs         worldserver.conf, authserver.conf, 모듈 conf (직접 수정 가능)
#   ${BASE_DATA_DIR}/data            실제 맵/vmap/mmap/dbc(koKR 포함) — 최초 설치 시 ac-kr-data-init이
#                                    자동으로 채움(아래 참고). 이미 채워져 있으면 다시 건드리지 않음.
#   ${BASE_DATA_DIR}/data/playbots   mod-playerbots 자체 갱신 확인용 SQL (자동 생성됨)
#   ${BASE_DATA_DIR}/mysql           MySQL 데이터 파일 (65개 모듈+한글화 SQL 이미 적용됨, 비어있으면 자동 시딩)
#   ${BASE_DATA_DIR}/logs            서버 로그
#   ${BASE_DATA_DIR}/backups         계정/캐릭터 백업 (scripts/backup.sh 또는 관리자 웹 /admin/backups)
#
# ⚠ data/ 폴더(맵 데이터, 용량이 커서 이미지로 배포하지 않음)는 ac-kr-data-init이 최초
#   1회만 자동으로 내려받아 채웁니다 — .env에 KR_DATA_URL(data.zip)과 KR_DBC_URL(한글
#   DBC zip, 1번을 푼 뒤 그 위에 덮어씀)을 지정해야 합니다(나스 파일 단위 공유 링크 등 —
#   폴더 공유 링크는 안 됨, deploy/README.md 참고). 이미 data/dbc에 내용이 있으면
#   (수동으로 넣어둔 경우 포함) 건드리지 않고 건너뜁니다. DBC/data 내용이 바뀌면 새
#   zip으로 교체 후 ${BASE_DATA_DIR}/data/.kr-data-installed 마커 파일을 수동으로
#   지워야 재설치됩니다.
#
# 사용법:
#   1) .env.example -> .env 복사, BASE_DATA_DIR·DOCKER_REGISTRY·KR_DATA_URL·KR_DBC_URL 지정
#      (DOCKER_REGISTRY: 이 이미지들을 실제로 구운 자신의 레지스트리 주소+프로젝트,
#      예: harbor.example.com/azerothcore. 이 저장소에는 실제 값을 커밋하지 않음.)
#   2) ./setup.sh 실행 (폴더 생성 + configs 복사)
#   3) 레지스트리가 private면: docker login $DOCKER_REGISTRY
#   4) docker compose pull && docker compose up -d
#      (최초 기동 시 ac-kr-data-init이 한글 DBC/data를 자동으로 받아서 풀어줍니다 —
#      용량에 따라 몇 분~몇십 분 걸릴 수 있으며, `docker compose logs -f ac-kr-data-init`
#      으로 진행 상황을 볼 수 있습니다.)
#
# ⚠ 최초 기동 후 반드시 할 일: realmlist 주소를 이 서버의 실제 접속 주소로 변경
#   docker exec -it ac-database mysql -uacore -pacore acore_auth \
#     -e "UPDATE realmlist SET address='<서버 IP 또는 도메인>' WHERE id=1;"

services:
  # BASE_DATA_DIR 아래에 다른 서비스들이 마운트할 하위 폴더를 매 기동 시 확인/생성한다.
  # 시놀로지 등 일부 환경은 바인드마운트 대상 폴더가 없으면 컨테이너 생성 자체가 실패하므로,
  # docker compose up만으로 항상 안전하게 뜨도록 하는 1회성 초기화 컨테이너.
  ac-dirs-init:
    image: alpine:3.20
    container_name: ac-dirs-init
    volumes:
      - ${BASE_DATA_DIR}:/base
    command: ["sh", "-c", "mkdir -p /base/data/playbots /base/mysql /base/logs /base/web-data /base/backups && echo '>> 필요한 하위 폴더 준비 완료'"]

  # 한글 DBC/data(Cameras/dbc/maps/mmaps/vmaps)를 최초 설치 시에만 나스 파일 공유에서
  # 받아 압축을 푼다 — 클라이언트 추출 바이너리라 이미지에 포함하지 않는다. 이미
  # 데이터가 있으면(마커 파일 또는 기존 dbc/ 내용) 즉시 건너뛰고, 그 이후 업데이트
  # 때는 다시 확인하지 않는다 (scripts/kr-data-init.sh 참고).
  ac-kr-data-init:
    image: alpine:3.20
    container_name: ac-kr-data-init
    volumes:
      - ${BASE_DATA_DIR}/data:/data
      - ./scripts/kr-data-init.sh:/kr-data-init.sh:ro
    environment:
      # data/를 이미 수동으로 채워둘 계획이면 비워둬도 된다 — kr-data-init.sh가 기존
      # 데이터 유무부터 먼저 확인하고, 필요할 때만 이 값을 요구한다.
      KR_DATA_URL: ${KR_DATA_URL:-}
      KR_DATA_SHA256: ${KR_DATA_SHA256:-}
      # 한글 DBC(별도 zip) — dbc/ 바로 아래 같은 파일명을 덮어써서 기본 dbc를 한글판으로
      # 교체한다. 비워두면 기본(영문) dbc만 설치된다.
      KR_DBC_URL: ${KR_DBC_URL:-}
      KR_DBC_SHA256: ${KR_DBC_SHA256:-}
    entrypoint: ["sh", "/kr-data-init.sh"]
    depends_on:
      ac-dirs-init:
        condition: service_completed_successfully

  # mod-playerbots가 기동 시마다 자기 자신의 커스텀 SQL 경로를 확인해서 신규 업데이트가
  # 있으면 적용한다. 이 폴더가 비어있으면 그 확인 단계에서 worldserver가 죽으므로 필요하다.
  ac-playerbots-data-init:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY를 .env에 설정하세요 - 예시 harbor.example.com/azerothcore}/ac-playerbots-data:latest
    container_name: ac-playerbots-data-init
    volumes:
      - ${BASE_DATA_DIR}/data/playbots:/azerothcore/source/azerothCore/modules/mod-playerbots/data/sql/playerbots
    depends_on:
      ac-dirs-init:
        condition: service_completed_successfully

  ac-database:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY를 .env에 설정하세요 - 예시 harbor.example.com/azerothcore}/ac-database-kr:latest
    container_name: ac-database
    networks: [ac-network]
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD를 .env에 설정하세요}
    volumes:
      - ${BASE_DATA_DIR}/mysql:/var/lib/mysql
    ports:
      - "${DOCKER_DB_EXTERNAL_PORT:-3307}:3306"
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40
    depends_on:
      ac-dirs-init:
        condition: service_completed_successfully

  # 코어/모듈 업데이트를 라이브 서버에 반영할 때만 쓰는 1회성 컨테이너 (AzerothCore 표준
  # Updater/dbimport 도구). Updates.Redundancy=1이라 이미 적용된 SQL은 건너뛰고 새 SQL만
  # 반영하므로 계정/캐릭터 등 기존 데이터를 건드리지 않는다. profiles로 묶어둬서 평소
  # `docker compose up -d`에는 안 끼고, `docker compose up ac-db-import`로 명시할 때만 실행됨
  # (scripts/apply-update.sh가 이 순서를 대신 해준다 — deploy/README.md "코어/모듈 업데이트" 참고).
  ac-db-import:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY를 .env에 설정하세요 - 예시 harbor.example.com/azerothcore}/ac-wotlk-db-import:latest
    container_name: ac-db-import
    networks: [ac-network]
    profiles: ["update"]
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      # dbimport는 스키마를 만들고 바꾸는(CREATE/ALTER/DROP TABLE) 작업이라 앱 계정(acore,
      # CRUD 권한만 있음)이 아니라 root로 접속한다 — worldserver/authserver/ac-web은 계속 acore.
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD를 .env에 설정하세요};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD를 .env에 설정하세요};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD를 .env에 설정하세요};acore_characters"
      # mod-playerbots는 자체 4번째 DB(acore_playerbots)를 쓰는데, 이건 표준
      # Updates.EnableDatabases 마스크(auth+world+character)에 안 잡혀서 이 값이 없으면
      # dbimport가 생성/갱신을 건너뛴다 (docker-compose.override.yml에 2026-09-03 실제
      # 빌드로 검증된 것과 동일하게 맞춤).
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD를 .env에 설정하세요};acore_playerbots"
    volumes:
      - ${BASE_DATA_DIR}/configs:/azerothcore/env/dist/etc
      - ${BASE_DATA_DIR}/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  ac-worldserver:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY를 .env에 설정하세요 - 예시 harbor.example.com/azerothcore}/ac-wotlk-worldserver:latest
    container_name: ac-worldserver
    networks: [ac-network]
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      DATAPATH: "/azerothcore/env/dist/data"
      USER_CONF_PATH: "/azerothcore/apps/docker/config-docker.sh"
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;acore;acore;acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;acore;acore;acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;acore;acore;acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;acore;acore;acore_playerbots"
    ports:
      - "${DOCKER_WORLD_EXTERNAL_PORT:-8085}:8085"
      - "${DOCKER_SOAP_EXTERNAL_PORT:-7878}:7878"
    volumes:
      - ${BASE_DATA_DIR}/configs:/azerothcore/env/dist/etc
      - ${BASE_DATA_DIR}/logs:/azerothcore/env/dist/logs
      - ${BASE_DATA_DIR}/data:/azerothcore/env/dist/data:ro
      # worldserver.conf의 SourceDirectory 값에 따라 mod-playerbots가 찾는 실제 경로가
      # 환경마다 다르게 해석될 수 있어(비어있으면 /azerothcore/modules/..., 값이 있으면
      # /azerothcore/<SourceDirectory>/modules/...), 두 경로 모두에 동일 데이터를 마운트해둔다.
      - ${BASE_DATA_DIR}/data/playbots:/azerothcore/source/azerothCore/modules/mod-playerbots/data/sql/playerbots:ro
      - ${BASE_DATA_DIR}/data/playbots:/azerothcore/modules/mod-playerbots/data/sql/playerbots:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-playerbots-data-init:
        condition: service_completed_successfully
      ac-kr-data-init:
        condition: service_completed_successfully

  ac-authserver:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY를 .env에 설정하세요 - 예시 harbor.example.com/azerothcore}/ac-wotlk-authserver:latest
    container_name: ac-authserver
    networks: [ac-network]
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;acore;acore;acore_auth"
    ports:
      - "${DOCKER_AUTH_EXTERNAL_PORT:-3724}:3724"
    volumes:
      - ${BASE_DATA_DIR}/configs:/azerothcore/env/dist/etc
      - ${BASE_DATA_DIR}/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  ac-web:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY를 .env에 설정하세요 - 예시 harbor.example.com/azerothcore}/ac-web:latest
    container_name: ac-web
    networks: [ac-network]
    restart: unless-stopped
    environment:
      # DB는 다른 서비스와 동일한 acore/acore 계정을 그대로 재사용 (전용 계정 불필요)
      DB_HOST: "ac-database"
      DB_PORT: "3306"
      DB_AUTH_USER: "acore"
      DB_AUTH_PASS: "acore"
      DB_AUTH_NAME: "acore_auth"
      REALMS: '[{"id":1,"name":"AzerothCore","charactersDb":"acore_characters"}]'
      SERVER_CORE: "1"
      SRP6_SUPPORT: "true"
      # SOAP 서비스 계정("websoap")은 ac-web이 최초 기동 시 이 비밀번호로 자동
      # 생성 + GM 권한(3) 부여함 — worldserver 콘솔에서 수동으로 만들 필요 없음.
      # 단, worldserver.conf의 SOAP.Enabled=1 / SOAP.IP="0.0.0.0"는 여전히 직접 설정 필요.
      SOAP_HOST: "ac-worldserver"
      SOAP_PORT: "7878"
      SOAP_URI: "urn:AC"
      SOAP_USERNAME: "websoap"
      SOAP_PASSWORD: ${WEB_SOAP_PASSWORD:?WEB_SOAP_PASSWORD를 .env에 설정하세요}
      SOAP_CA_COMMAND: "account create {USERNAME} {PASSWORD}"
      SOAP_CP_COMMAND: "account set password {USERNAME} {PASSWORD} {PASSWORD}"
      SOAP_ASA_COMMAND: "account set addon {USERNAME} {EXPANSION}"
      ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:?WEB_ADMIN_PASSWORD를 .env에 설정하세요}
      ADMIN_SESSION_SECRET: ${WEB_ADMIN_SESSION_SECRET:?WEB_ADMIN_SESSION_SECRET를 .env에 설정하세요 (openssl rand -hex 32)}
    volumes:
      - ${BASE_DATA_DIR}/web-data:/app/data
      # scripts/backup.sh·restore.sh(호스트)가 쓰는 것과 같은 경로 — 웹 UI와 CLI가
      # 같은 백업 세트를 공유한다 (deploy/README.md "계정/캐릭터 백업 · 복원" 참고).
      - ${BASE_DATA_DIR}/backups:/app/backups
    ports:
      - "${DOCKER_WEB_EXTERNAL_PORT:-11220}:3000"
    depends_on:
      ac-dirs-init:
        condition: service_completed_successfully
      ac-database:
        condition: service_healthy

networks:
  ac-network:
